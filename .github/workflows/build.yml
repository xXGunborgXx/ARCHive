name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\ARCHive.sln

      - name: Build
        run: dotnet build .\ARCHive.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\ARCHive.sln --configuration Release --no-build
